[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "End-to-end invoice extraction service with OCR, validation, and optional LLM structured output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pdfplumber>=0.11.0",
  "pillow>=10.0.0",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "python-dateutil>=2.9.0",
  "pymupdf>=1.24.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
invoice-extractor = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.uvicorn]
factory = false
